<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <main class="dashboard">

    <!-- Average Users -->
    <section class="card average-users">
      <div class="card-heading">
        <h2>Average users</h2>
        <span>+137%</span>
      </div>

      <div class="wave wave-one"></div>
      <div class="wave wave-two"></div>

      <strong class="big-number">2,568</strong>
    </section>


    <!-- Total Subscribers -->
    <section class="card subscribers">
      <div class="card-heading">
        <h2>Total subscribers</h2>
        <span>+12%</span>
      </div>

      <div class="subscriber-chart">
        <div class="chart-line"></div>
        <div class="chart-fill"></div>
      </div>

      <strong class="subscriber-number">350K</strong>
    </section>


    <!-- Daily Viewers -->
    <section class="card daily-viewers">
      <span class="live">Live</span>

      <p>Daily Viewers</p>
      <strong>05K</strong>
    </section>


    <!-- Daily Comments -->
    <section class="card daily-comments">
      <p>Daily Comments</p>

      <div class="comment-row">
        <span class="comment-icon">◉</span>
        <strong>2K</strong>
      </div>
    </section>


    <!-- Daily Share -->
    <section class="card daily-share">
      <p>Daily Share</p>

      <div class="share-row">
        <span class="share-icon">●</span>
        <strong>1K</strong>
      </div>
    </section>


    <!-- Weekly Likes -->
    <section class="card weekly-likes">
      <div>
        <h3>Weekly Likes</h3>

        <div class="likes-number">
          <span>♥</span>
          <strong>75K</strong>
        </div>
      </div>
    </section>


    <!-- Profile -->
    <section class="card profile">
      <div class="profile-title">
        <span class="profile-icon">♟</span>
        <strong>Profile</strong>
      </div>

      <div class="profile-lines">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </section>


    <!-- Apps 1 -->
    <section class="card app app-one">
      <div class="app-circle">Apps</div>
    </section>


    <!-- Apps 2 -->
    <section class="card app app-two">
      <div class="app-circle">Apps</div>
    </section>


    <!-- Apps 3 -->
    <section class="card app app-three">
      <div class="app-circle">Apps</div>
    </section>


    <!-- Apps 4 -->
    <section class="card app app-four">
      <div class="app-circle">Apps</div>
    </section>


    <!-- Bottom Banner -->
    <section class="card banner">
      <div class="banner-shape"></div>

      <div class="banner-content">
        <p>
          Learn modern UI and Web Design in<br>
          one powerful platform
        </p>

        <div class="banner-lines">
          <span></span>
          <span></span>
        </div>
      </div>
    </section>

  </main>

</body>
</html>
